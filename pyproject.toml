[project]
name = "coding-theory-algorithms"
version = "0.0.0"
description = "Coding theory algorithms for solving textbook exercises"
requires-python = ">=3.10"
dependencies = ["numpy>=2.2,<2.3"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
